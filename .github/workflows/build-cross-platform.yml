name: Catstella desktop release

on:
  push:
    tags: ['v*', 'desktop-v*']
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build Windows installer without macOS and Linux bundles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catstella-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/web-source-v1.5.2
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run prepare:frontend
      - run: npm run test:rust
      - run: npm test
      - run: npm run verify:hud
      - run: node --test test/turn-watcher.test.cjs test/runtime.test.cjs test/audio.test.cjs
        working-directory: web/Gemini-Web-Companion
      - run: npm run build:tauri
      - run: npm run setup:inno
      - name: Build Windows installer (with bundled Web extension)
        shell: pwsh
        run: |
          $env:WEB_COMPANION_PATH = Join-Path $env:GITHUB_WORKSPACE 'web/Gemini-Web-Companion'
          node src-tauri/scripts/build-tauri-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seedDir = Join-Path $env:RUNNER_TEMP 'web-online-seed'
          node -e "require('./tools/online-seed.cjs').writeOnlineSeed('online-assets', process.argv[1])" $seedDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CATSTELLA_ONLINE_SEED = $seedDir
          node (Join-Path $env:WEB_COMPANION_PATH 'scripts/build.js')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: catstella-windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            desktop/dist/installers/Catstella-Setup-*-x64.exe
            desktop/dist/installers/Catstella-Setup-*-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: catstella-web-extensions
          compression-level: 0
          if-no-files-found: error
          path: |
            web/Gemini-Web-Companion/dist/kimino-gemini-companion-edge-chrome.zip
            web/Gemini-Web-Companion/dist/kimino-gemini-companion.xpi

  unix:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} (Tauri experimental)
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, runner: macos-15-intel, arch: arm64, target: aarch64-apple-darwin }
          - { platform: mac, runner: macos-15-intel, arch: x64, target: "" }
          - { platform: linux, runner: ubuntu-24.04, arch: x64, target: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - run: npm ci
      - run: npm run prepare:frontend
      - run: npm run test:rust
      - name: Build Tauri bundle
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          mkdir -p dist/installers
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if [[ -n "${{ matrix.target }}" ]]; then
              npx --yes @tauri-apps/cli@2 build --target "${{ matrix.target }}" --config '{"bundle":{"active":true}}' --bundles dmg
              dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f -print -quit)
            else
              npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"active":true}}' --bundles dmg
              dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)
            fi
            test -n "$dmg"
            cp "$dmg" "dist/installers/Catstella-$version-mac-${{ matrix.arch }}.dmg"
          else
            APPIMAGE_EXTRACT_AND_RUN=1 npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"active":true}}' --bundles deb,appimage
            appimg=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f -print -quit)
            deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)
            test -n "$appimg"
            test -n "$deb"
            cp "$appimg" "dist/installers/Catstella-$version-linux-x86_64.AppImage"
            cp "$deb" "dist/installers/Catstella-$version-linux-amd64.deb"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catstella-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/installers/Catstella-*

  release:
    if: github.event_name == 'push'
    needs: [windows, unix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: catstella-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/web-source-v1.5.2
          path: web-source
          persist-credentials: false
      - name: Check packages and publish desktop and Web releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          webversion=$(node -p 'require("./web-source/Gemini-Web-Companion/package.json").version')
          [[ "$GITHUB_REF_NAME" == "desktop-v$version" || "$GITHUB_REF_NAME" == "v$version" ]]
          cd release-assets
          files=(
            "Catstella-Setup-$version-x64.exe"
            "Catstella-$version-mac-arm64.dmg"
            "Catstella-$version-mac-x64.dmg"
            "Catstella-$version-linux-x86_64.AppImage"
            "Catstella-$version-linux-amd64.deb"
          )
          webfiles=("kimino-gemini-companion-edge-chrome.zip" "kimino-gemini-companion.xpi")
          files+=("${webfiles[@]}")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum --check "${files[0]}.sha256"
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat > notes.md <<'EOF'
          - **内容商店体验升级**：新增全屏「沉浸式壁纸 / 主题预览」（支持模拟对话叠加、可见度/遮罩试调与系列切换）、规格/状态 Chips 详情页以及醒目的原作者 Credits 署名与原作发布页直达按钮。
          - **耐力条高阶自定义**：旁侧耐力计新增三种外观风格（微晶玻璃 / 霓虹辉光 / 极简无框）、6 套独立配色与任意自定义色盘，以及 40–100% 透明度调节，桌面端与设置预览舱实时同步。
          - **全局通知与性能提速**：新增应用更新横幅与内容商店上新角标检测；设置中心改用先渲染后显窗、按当前页签按需更新与图片懒加载，大幅压缩冷启动显窗耗时。
          - **Tauri 2 底座与跨端联动**：沿用 `0.7.0` 正式 Tauri 2 + WebView2 架构、5 频道 Bento HUD 与 Web 伴侣 v1.5.2 联动；`macOS arm64` 与 `x64` 已改为稳定交叉编译出包。
          - **附带平台构建**：Windows x64 安装包内含可选 Web 扩展；macOS（`.dmg`）与 Linux（`.AppImage` / `.deb`）为 Tauri 云端构建实验包，暂不支持 Windows 专用的宿主窗口跟随，Firefox XPI 未签名，macOS 未公证。
          - 使用 `SHA256SUMS.txt` 校验下载文件。
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Catstella $version" --notes-file notes.md --latest "${files[@]}" SHA256SUMS.txt
          if ! gh release view "web-v$webversion" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sha256sum "${webfiles[@]}" > WEB-SHA256SUMS.txt
            gh release create "web-v$webversion" --repo "$GITHUB_REPOSITORY" --target "web-source-v$webversion" \
              --title "Catstella Web $webversion" --notes-file notes.md --latest=false "${webfiles[@]}" WEB-SHA256SUMS.txt
          fi
